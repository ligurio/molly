name: Testing

on:
  push:
  pull_request:

jobs:
  testing:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        include:
          - runtime: luajit
            version: '2.1'
          - runtime: tarantool
            version: '2.11'
            coverage: true
          - runtime: tarantool
            version: '3.8'
      fail-fast: false
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v3

      - name: Setup Tarantool (${{ matrix.version }})
        if: matrix.runtime == 'tarantool'
        uses: tarantool/setup-tarantool@v4
        with:
          tarantool-version: ${{ matrix.version }}

      - name: Setup LuaJIT
        if: matrix.runtime == 'luajit'
        run: sudo apt install -y luajit

      - name: Setup luarocks
        run: sudo apt install -y luarocks

      - name: Setup SQLite devepelopment package
        run: sudo apt install -y sqlite3 libsqlite3-dev

      - name: Setup dependencies
        run: make deps

      - run: echo $(luarocks path --lr-bin) >> $GITHUB_PATH

      - name: Run tests with Tarantool and send coverage to Coveralls.io
        if: matrix.runtime == 'tarantool' && matrix.coverage
        run: make coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV: ON

      - name: Run tests with Tarantool (${{ matrix.version }})
        if: matrix.runtime == 'tarantool' && !matrix.coverage
        run: DEV=ON make test-tarantool

      - name: Run tests with LuaJIT
        if: matrix.runtime == 'luajit'
        run: LUAJIT_BIN=luajit DEV=ON make test-luajit
